* { box-sizing:border-box; }
body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--tx); }
header { padding:20px 24px; border-bottom:1px solid var(--line); background:linear-gradient(180deg,#101826,#0b0f14); }
h1 { margin:0 0 6px; font-size:20px; font-weight:650; }
.sub { color:var(--mut); font-size:13px; }
.stats { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
.stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; min-width:120px; }
.stat b { display:block; font-size:18px; color:var(--ok); }
.stat span { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.controls { display:flex; flex-wrap:wrap; gap:8px; padding:14px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:#0b0f14ee; backdrop-filter:blur(8px); z-index:5; }
input,select,button { background:var(--card); color:var(--tx); border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
input { min-width:260px; flex:1; }
button { cursor:pointer; background:#1a2a3d; }
button:hover { border-color:var(--acc); }
table { width:100%; border-collapse:collapse; font-size:12.5px; }
th,td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
th { position:sticky; top:58px; background:#0e1520; color:var(--mut); font-weight:600; cursor:pointer; }
tr:hover td { background:#121a24; }
a { color:var(--acc); text-decoration:none; }
.tag { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px; border:1px solid var(--line); color:var(--mut); }
.tag.a { color:var(--ok); border-color:#1e4d38; }
.tag.oauth { color:#7eb6ff; border-color:#1e3a5f; }
.tag.open { color:var(--warn); border-color:#5a4520; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px; word-break:break-all; }
#count { color:var(--mut); align-self:center; padding:0 6px; }
</style>

const tb = document.getElementById('tb');
const q = document.getElementById('q');
const auth = document.getElementById('auth');
const tier = document.getElementById('tier');
const src = document.getElementById('src');
const dcr = document.getElementById('dcr');
const count = document.getElementById('count');
let sortKey = 'host', sortDir = 1;

const sources = [...new Set(DATA.map(r => r.discovery_source).filter(Boolean))].sort();
sources.forEach(s => { const o=document.createElement('option'); o.value=s; o.textContent=s; src.appendChild(o); });

function esc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }

function filtered(){
  const qq = q.value.trim().toLowerCase();
  let rows = DATA.filter(r => {
    if (tier.value && r.confidence !== tier.value) return false;
    if (src.value && r.discovery_source !== src.value) return false;
    if (dcr.checked && !r.dynamic_client_registration) return false;
    if (auth.value) {
      if (auth.value === 'other') {
        if (['oauth','none_public','bearer_token'].includes(r.auth)) return false;
      } else if (r.auth !== auth.value && !(auth.value==='oauth' && r.oauth_confirmed)) return false;
    }
    if (!qq) return true;
    const blob = [r.host,r.endpoint,r.server_name,r.issuer,r.authorization_endpoint,r.discovery_source].join(' ').toLowerCase();
    return blob.includes(qq);
  });
  rows.sort((a,b) => {
    let av=a[sortKey], bv=b[sortKey];
    if (typeof av === 'boolean') { av=+av; bv=+bv; }
    av = (av??'').toString().toLowerCase(); bv=(bv??'').toString().toLowerCase();
    if (av<bv) return -1*sortDir; if (av>bv) return 1*sortDir; return 0;
  });
  return rows;
}

function render(){
  const rows = filtered();
  count.textContent = rows.length + ' / ' + DATA.length;
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement('tr');
    const tierCls = r.confidence.startsWith('A') ? 'a' : '';
    const authCls = r.oauth_confirmed ? 'oauth' : (r.auth==='none_public' ? 'open' : '');
    tr.innerHTML = `
      <td class="mono">${esc(r.host)}</td>
      <td class="mono"><a href="${esc(r.endpoint)}" target="_blank" rel="noopener">${esc(r.endpoint)}</a></td>
      <td><span class="tag ${tierCls}">${esc(r.confidence.replace('_mcp','').replace('_',' '))}</span></td>
      <td><span class="tag ${authCls}">${esc(r.oauth_confirmed?'oauth':r.auth)}</span></td>
      <td>${esc(r.server_name)}</td>
      <td class="mono">${esc(r.issuer)}</td>
      <td>${esc(r.discovery_source)}</td>
      <td>${r.dynamic_client_registration ? 'yes' : ''}</td>`;
    frag.appendChild(tr);
  }
  tb.innerHTML = '';
  tb.appendChild(frag);
}

q.addEventListener('input', render);
auth.addEventListener('change', render);
tier.addEventListener('change', render);
src.addEventListener('change', render);
dcr.addEventListener('change', render);
document.querySelectorAll('th[data-k]').forEach(th => th.addEventListener('click', () => {
  const k = th.dataset.k;
  if (sortKey === k) sortDir *= -1; else { sortKey=k; sortDir=1; }
  render();
}));
document.getElementById('csv').onclick = () => {
  const rows = filtered();
  const keys = Object.keys(rows[0]||{});
  const lines = [keys.join(',')].concat(rows.map(r => keys.map(k => {
    let v = r[k]==null?'':String(r[k]);
    if (/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
    return v;
  }).join(',')));
  const blob = new Blob([lines.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'filtered_mcp.csv'; a.click();
};
render();
</script>
